<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rwanda Health Facilities</title>
    <link rel="stylesheet" href="style.css"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4"></script>
</head>
<body>
    <header class="nav-container">
        <h1>Rwanda Health Facilities</h1>
        <nav>
            <ul>
                <li><a href="#" target="_blank">Home</a></li>
                <li><a href="#" target="_blank">Search</a></li>
                <li><a href="#" target="_blank">About</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <p id="loading" style="display:none">Loading...</p>
        <form >
            <label for="district">District:</label>
            <input type="text" name="facility-district" id="district-input" placeholder="e.g. Gasabo"/><br/>
            <label for="type">Type:</label>
            <select id="type" name="type">
                <option value="">choose type</option>
                <option value="hospital">Hospital</option>
                <option value="clinic">Clinic</option>
                <option value="health_center">Health Center</option>
            </select><br/>
            <input type="submit" name="Search" class="Search-button" value="Search"/>
            <input type="submit" name="Clear" class="Clear-button" value="Clear"/>
        </form>
        <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>District</th>
                    <th>coordinates</th>
                    <th>Services</th>
                    <th>Last Updated</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        </div>
        <!-- Facility Cards -->
        <section class="cards-container">
            <div>
            </div>
        </section>
        <section class="charts-container">
            <canvas id="analyticsChart"></canvas>
        </section>
    </main>
    <footer>Sylivie &copy;2026</footer>
<script src="app.js"></script>
</body>
</html>
